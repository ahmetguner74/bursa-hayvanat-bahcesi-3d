<!doctype html>
<html lang="tr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#dce7d8">
  <title>Bursa Hayvanat Bahçesi · 3B Atlas</title>
  <link rel="stylesheet" href="style.css?v=20261016au">
  <script type="importmap">{"imports":{"three":"./vendor/three.module.js"}}</script>
</head>
<body>
  <main id="stage" class="stage" aria-label="Bursa Hayvanat Bahçesi etkileşimli üç boyutlu alan modeli">
    <div id="canvas"></div>
    <div id="loading" role="status"><span class="loading-content"><img class="loading-spinner" src="./assets/loader.svg" alt="" width="22" height="22"><span>Hayvanat bahçesi yükleniyor…</span></span></div>
    <header class="topbar">
      <div class="top-context">
        <div class="identity">
          <a class="identity-mark" href="./models/ATTRIBUTION.txt" target="_blank" rel="noopener" aria-label="3B model kaynakları ve lisanslar" title="Model kaynakları">B·H</a>
          <span class="identity-copy"><strong>Bursa Hayvanat Bahçesi</strong><small id="view-hint" role="status">Genel plan</small></span>
        </div>
        <button id="back" class="back" type="button" hidden><img src="./assets/arrow-left.svg" alt="" width="18" height="18"><span id="back-label">Genel plana dön</span></button>
      </div>
      <div class="top-actions">
        <button id="fullscreen" type="button" aria-label="Tam ekran" aria-pressed="false" title="Tam ekran"><img src="./assets/maximize.svg" alt="" width="20" height="20"></button>
        <button id="capture-scene" type="button" hidden>3B görüntüyü indir</button>
      </div>
    </header>
    <p id="interaction-hint" class="interaction-hint">Bir yaşam alanına dokun.</p>
    <button id="load-retry" class="load-retry" type="button" hidden>Tekrar yükle</button>
    <div id="scene-labels" class="scene-labels" aria-label="Keşfedilebilir yaşam alanları ve hayvanlar"></div>
    <div id="touch-cue" class="touch-cue" aria-hidden="true" hidden><img src="./assets/touch-pointer.svg" alt="" width="24" height="24"><span>Dokun</span></div>
    <aside id="animal-info" class="animal-info" aria-labelledby="animal-title" hidden>
      <div class="animal-species">
        <span class="info-eyebrow">Tanışalım</span>
        <h1 id="animal-title" data-species></h1>
        <p class="scientific-name" data-scientific></p>
        <p data-intro></p>
        <p class="compact-copy species-summary" data-summary></p>
        <dl class="species-facts" data-facts></dl>
      </div>
      <section class="animal-behavior" aria-labelledby="behavior-title" hidden>
        <div class="behavior-caption"><span class="info-eyebrow">Şu anda</span><span class="behavior-place" data-place></span></div>
        <h2 id="behavior-title" data-behavior></h2>
        <p data-behavior-description></p>
        <p class="compact-copy" data-short-description></p>
      </section>
      <a class="species-source" data-source target="_blank" rel="noopener" aria-label="Tür bilgisi · San Diego Zoo"><span class="source-desktop">Tür bilgisi · San Diego Zoo ↗</span><span class="source-mobile">Tür bilgisi ↗</span></a>
    </aside>
    <p id="animal-announcement" class="sr-only" role="status" aria-live="polite"></p>
  </main>
  <script type="module" src="app.js?v=20261016au"></script>
</body>
</html>
