<!doctype html>
<html lang="tr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#dce7d8">
  <title>Bursa Hayvanat Bahçesi · 3B Atlas</title>
  <link rel="stylesheet" href="style.css?v=20261014d">
  <script type="importmap">{"imports":{"three":"./vendor/three.module.js"}}</script>
</head>
<body>
  <main id="stage" class="stage" aria-label="Bursa Hayvanat Bahçesi etkileşimli üç boyutlu alan modeli">
    <div id="canvas"></div>
    <div id="loading" role="status">Bahçe hazırlanıyor…</div>

    <header class="topbar">
      <div class="identity" aria-label="Bursa Hayvanat Bahçesi 3B Atlası">
        <span class="identity-mark" aria-hidden="true">B·H</span>
        <span class="identity-copy"><strong>Bursa Hayvanat Bahçesi</strong><small id="view-hint" role="status">Genel plan</small></span>
      </div>
      <div class="top-actions">
        <button id="layers-toggle" type="button" aria-expanded="false" aria-controls="layers-panel" aria-label="Görünüm ayarları" title="Görünüm ayarları"><span aria-hidden="true">☷</span><span class="action-label">Görünüm</span></button>
        <button id="fullscreen" type="button" aria-label="Tam ekran" title="Tam ekran" aria-pressed="false"><span aria-hidden="true">⛶</span><span class="action-label">Tam ekran</span></button>
      </div>
    </header>

    <aside id="layers-panel" class="layers-panel" aria-label="Görünüm ayarları" hidden>
      <div class="layers-head"><strong>Görünüm</strong><button id="layers-close" type="button" aria-label="Görünüm ayarlarını kapat">×</button></div>
      <div class="layers-section-title">Katmanlar</div>
      <button id="toggle-trees" type="button" aria-pressed="true">Ağaçlar</button>
      <button id="toggle-buildings" type="button" aria-pressed="true">Yapılar</button>
      <div class="perspective-control">
        <label for="perspective">Genel plan perspektifi <output id="perspective-value" for="perspective">45%</output></label>
        <input id="perspective" type="range" min="0" max="100" step="1" value="45" aria-label="Genel plan perspektifi">
        <div class="range-ends" aria-hidden="true"><span>Düz plan</span><span>Daha derin</span></div>
      </div>
    </aside>

    <div id="markers" class="markers"></div>
    <div id="map-guide" class="map-guide" aria-label="Harita yönü ve ölçeği">
      <span class="north"><span id="north-arrow" aria-hidden="true">↑</span> K</span>
      <span class="scale"><i id="scale-rule"></i><span id="scale-label">100 m</span></span>
    </div>

    <nav class="viewbar" aria-label="Görünüm seçimi">
      <button data-view="site" class="active" aria-pressed="true"><span class="full">Genel plan</span><span class="short">Alan</span></button>
      <button data-view="cage" aria-pressed="false"><span class="full">Kafes dışı</span><span class="short">Dış</span></button>
      <button data-view="entry" aria-pressed="false"><span class="full">Girişten</span><span class="short">Giriş</span></button>
      <button data-view="inside" aria-pressed="false"><span class="full">İçeriden</span><span class="short">İç</span></button>
      <button data-view="cage-top" aria-pressed="false"><span class="full">Üstten</span><span class="short">Üst</span></button>
    </nav>
    <div class="zoom" role="group" aria-label="Harita denetimleri">
      <button id="zoom-in" type="button" aria-label="Yakınlaştır" title="Yakınlaştır">+</button>
      <button id="zoom-out" type="button" aria-label="Uzaklaştır" title="Uzaklaştır">−</button>
      <button id="reset" type="button" aria-label="Genel plana dön" title="Genel plana dön">⌖</button>
    </div>
  </main>
  <script type="module" src="app.js?v=20261014o"></script>
</body>
</html>
